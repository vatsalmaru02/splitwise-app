<h2 mat-dialog-title class="dialog-title">
  {{ data.title }}
</h2>

<mat-dialog-content>
  <p class="message">Are you sure you want to delete this?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close class="btn">Cancel</button>
  <button mat-raised-button [mat-dialog-close]="true" class="btn delete">Delete</button>
</mat-dialog-actions>
