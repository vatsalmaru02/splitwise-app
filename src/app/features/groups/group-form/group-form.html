<mat-card class="card">
  <h1>Create Group</h1>

  <form [formGroup]="form">
    <mat-form-field appearance="outline">
      <mat-label>Group Name</mat-label>

      <input matInput formControlName="name" />
    </mat-form-field>

    <div class="members-section">
      <button mat-raised-button type="button" (click)="addMember()">Add Member</button>

      <div formArrayName="members">
        @for (member of members.controls; track $index) {
          <div class="member-row">
            <mat-form-field appearance="outline">
              <mat-label>Member Name</mat-label>

              <input matInput [formControlName]="$index" />
            </mat-form-field>

            <button mat-button color="warn" type="button" (click)="removeMember($index)">
              Remove
            </button>
          </div>
        }
      </div>
    </div>

    <button mat-raised-button color="primary" (click)="saveGroup()">Save Group</button>
  </form>
</mat-card>
