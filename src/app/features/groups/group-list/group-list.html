<div class="container">
  <div class="header">
    <h1>Groups</h1>
    <button mat-raised-button color="primary" (click)="createGroup()">Create Group</button>
  </div>

  @if (groups.length === 0) {
    <mat-card class="empty-card">No groups found.</mat-card>
  }

  <div class="group-grid">
    @for (group of groups; track group.id) {
      <mat-card class="group-card">
        <h2>{{ group.name }}</h2>
        <p>Members: {{ group.members.length }}</p>

        <div class="actions">
          <button mat-button [routerLink]="['/groups', group.id]">View Group</button>
          <button mat-button color="warn" (click)="deleteGroup(group.id)">Delete Group</button>
        </div>
      </mat-card>
    }
  </div>
</div>
