<div class="container">
  <h1>Dashboard</h1>

    <div class="stats-grid">
      <mat-card class="stat-card">
        <h2>{{ totalGroups }}</h2>
        <p>Total Groups</p>
      </mat-card>

      <mat-card class="stat-card">
        <h2>{{ totalExpenses }}</h2>
        <p>Total Expenses</p>
      </mat-card>

      <mat-card class="stat-card">
        <h2>{{ totalSettlements }}</h2>
        <p>Total Settlements</p>
      </mat-card>

      <mat-card class="stat-card">
        <h2>$0.00</h2>
        <p>Outstanding Balance</p>
      </mat-card>
    </div>
</div>
